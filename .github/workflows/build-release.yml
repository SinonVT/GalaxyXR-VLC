name: Build VLC Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check source ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f vlc-android-patched.zip ]; then
            echo "ERROR: vlc-android-patched.zip not found"
            ls -lah
            exit 1
          fi

          ls -lh vlc-android-patched.zip

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf vlc-src
          mkdir -p vlc-src

          unzip -q vlc-android-patched.zip -d vlc-src

      - name: Find VLC project root
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/vlc-src" \
            -type f \
            -name settings.gradle \
            -print \
            -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find "$GITHUB_WORKSPACE/vlc-src" \
              -maxdepth 4 \
              -type f \
              | sort
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "VLC project root:"
          echo "$ROOT"

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Prepare LibVLCJNI
        shell: bash
        run: |
          set -e

          echo "Preparing LibVLCJNI..."

          cd "$ROOT"

          rm -rf libvlcjni

          git clone \
            --no-single-branch \
            https://code.videolan.org/videolan/libvlcjni.git \
            libvlcjni

          cd libvlcjni

          git checkout 0b8dc65efb203c86a0476bc337ddd99ecf1c0ef6

          echo "LibVLCJNI revision:"
          git rev-parse HEAD

          echo "LibVLCJNI contents:"
          ls -la

          echo "LibVLC Gradle project:"
          ls -la libvlc

      - name: Create local.properties
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > "$ROOT/local.properties"

          cat "$ROOT/local.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$ROOT"

          echo "Building from:"
          pwd

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleRelease

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$ROOT" \
            -type f \
            -name "*.apk" \
            -print

          COUNT=$(find "$ROOT" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced"
            exit 1
          fi

      # assembleRelease produces UNSIGNED APKs, and Android refuses to
      # install those ("package appears to be invalid"). The steps below
      # sign them with YOUR permanent key, which is stored in GitHub
      # secrets (never in this file), so every build carries the same
      # signature and people can update from one build to the next.
      - name: Load signing key from secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: vlc
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: signing secrets are missing."
            echo "Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD under"
            echo "Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

          # Fails here, clearly, if the key or password is wrong
          if ! keytool -list \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "ERROR: could not open the signing key."
            echo "Check that KEYSTORE_BASE64 and KEYSTORE_PASSWORD were pasted"
            echo "exactly, with no extra spaces or line breaks."
            exit 1
          fi

          echo "Signing key loaded."

      - name: Sign release APKs
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: vlc
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          OUTDIR="$GITHUB_WORKSPACE/signed-apks"
          TMPDIR_ALIGN="$RUNNER_TEMP/aligned"

          rm -rf "$OUTDIR" "$TMPDIR_ALIGN"
          mkdir -p "$OUTDIR" "$TMPDIR_ALIGN"

          FOUND=0

          while IFS= read -r -d '' APK; do
            FOUND=$((FOUND + 1))
            NAME=$(basename "$APK" .apk)
            SRC="$APK"

            echo "=== Signing: $APK"

            # Signing must happen on an aligned file
            if ! "$ZIPALIGN" -c 4 "$SRC"; then
              echo "Aligning $NAME first"
              "$ZIPALIGN" -p -f 4 "$SRC" "$TMPDIR_ALIGN/$NAME.apk"
              SRC="$TMPDIR_ALIGN/$NAME.apk"
            fi

            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEYSTORE_PASSWORD \
              --v4-signing-enabled false \
              --out "$OUTDIR/$NAME.apk" \
              "$SRC"

            "$APKSIGNER" verify --verbose --print-certs "$OUTDIR/$NAME.apk"
          done < <(find "$ROOT" \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -print0)

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: no APKs found to sign"
            exit 1
          fi

          echo "Signed APKs:"
          ls -lh "$OUTDIR"

      # Private copy for testing (needs a GitHub login to download, expires)
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Android-release-signed
          path: "signed-apks/*.apk"
          if-no-files-found: error
          retention-days: 14

      # Public download page for everyone else. Only runs when you start the
      # workflow by hand (Actions tab > Run workflow), so ordinary pushes do
      # not spam your Releases page.
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          set -e

          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Unofficial build of VLC for Android with an on-screen back button added to the video player.

          The release also contains builds for other Android architectures:

          * `arm64-v8a` — **Galaxy XR / 64-bit ARM**
          * `armeabi-v7a` — 32-bit ARM
          * `x86` — 32-bit x86
          * `x86_64` — 64-bit x86

          For Galaxy XR, **use `arm64-v8a`**.
          EOF

          gh release create "$TAG" signed-apks/*.apk \
            --target "$GITHUB_SHA" \
            --title "VLC Android build ${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/notes.md"
